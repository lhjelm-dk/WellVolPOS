# The test suite runs on every push. A clone ships prospect A and prospect C only --
# prospect B is not published -- and the suite is green on exactly that set, which is
# what this workflow exists to prove.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floors in requirements.txt need 3.11 or newer; see the note there.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # requirements-dev pulls requirements.txt and adds pytest. kaleido comes with
        # it but has no browser to drive here, so the handful of tests that need one
        # skip themselves -- `export.kaleido_available()` renders a probe rather than
        # trusting the import, which is the difference that keeps this green.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run the tests
        run: pytest -q
